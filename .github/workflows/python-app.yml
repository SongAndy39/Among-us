name: Build cross-platform releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v2.1.0)"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  test:
    name: Protocol test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tkinter
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Compile and run protocol tests
        run: |
          python -m compileall -q .
          python -u tests/protocol_selftest.py

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            executable: 太空狼人杀v2.0.0.exe
          - os: ubuntu-latest
            name: linux
            executable: 太空狼人杀v2.0.0
          - os: macos-latest
            name: mac
            executable: 太空狼人杀v2.0.0.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Tkinter
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build executable
        run: pyinstaller --clean --noconfirm "太空狼人杀.spec"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/太空狼人杀v2.0.0/*" -DestinationPath "太空狼人杀-windows.zip"

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          tar -czf 太空狼人杀-linux.tar.gz -C dist 太空狼人杀v2.0.0

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/太空狼人杀v2.0.0.app" \
            "太空狼人杀-mac.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-release
          path: |
            太空狼人杀-windows.zip
            太空狼人杀-linux.tar.gz
            太空狼人杀-mac.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download platform releases
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract release tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Find update announcement
        id: announcement
        run: |
          ANNOUNCEMENT_FILE=""
          for file in *.md; do
            if [[ "$file" == *"${GITHUB_REF_NAME}"* ]]; then
              ANNOUNCEMENT_FILE="$file"
              break
            fi
          done
          echo "FILE=$ANNOUNCEMENT_FILE" >> "$GITHUB_OUTPUT"

      - name: Read announcement
        if: steps.announcement.outputs.FILE != ''
        id: announcement_content
        run: |
          BODY=$(cat "${{ steps.announcement.outputs.FILE }}" | sed 's/"/\\"/g' | tr '\n' ' ')
          echo "BODY=$BODY" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.announcement_content.outputs.BODY || 'Cross-platform release built by GitHub Actions.' }}
          files: |
            release-assets/太空狼人杀-windows.zip
            release-assets/太空狼人杀-linux.tar.gz
            release-assets/太空狼人杀-mac.zip