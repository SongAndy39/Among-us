name: Build cross-platform releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v2.1.0)"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  test:
    name: Protocol test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tkinter
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Compile and run protocol tests
        run: |
          python -m compileall -q .
          python -u tests/protocol_selftest.py

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-15
            name: mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Tkinter
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Verify universal2 Python
        if: runner.os == 'macOS'
        run: |
          PYTHON=$(python -c 'import sys; print(sys.executable)')
          ARCHS=$(lipo -archs "$PYTHON")
          echo "Python architectures: $ARCHS"
          [[ " $ARCHS " == *" arm64 "* && " $ARCHS " == *" x86_64 "* ]]

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm "太空狼人杀.spec"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Space Werewolf/*" -DestinationPath "Space-Werewolf-windows.zip"

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          tar -czf Space-Werewolf-linux.tar.gz -C dist "Space Werewolf"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          APP="dist/Space Werewolf.app"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Contents/Info.plist")
          python - "$APP" "$EXECUTABLE" <<'PY'
          import pathlib
          import subprocess
          import sys

          app = pathlib.Path(sys.argv[1])
          executable = sys.argv[2]
          binaries = []
          for path in app.rglob("*"):
              if not path.is_file():
                  continue
              file_type = subprocess.run(
                  ["file", "-b", str(path)],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              if "Mach-O" not in file_type:
                  continue
              architectures = set(subprocess.check_output(
                  ["lipo", "-archs", str(path)], text=True
              ).split())
              if not {"arm64", "x86_64"}.issubset(architectures):
                  raise SystemExit(
                      f"Not universal2: {path} ({sorted(architectures)})"
                  )
              binaries.append(path)

          main_binary = app / "Contents" / "MacOS" / executable
          if main_binary not in binaries:
              raise SystemExit(f"App executable is not a Mach-O binary: {main_binary}")
          print(f"Verified {len(binaries)} universal2 Mach-O binaries")
          PY
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "Space-Werewolf-mac-universal2.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-release
          path: |
            Space-Werewolf-windows.zip
            Space-Werewolf-linux.tar.gz
            Space-Werewolf-mac-universal2.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download platform releases
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract release tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Space Werewolf ${{ steps.get_version.outputs.VERSION }}
          body: |
            Cross-platform release for Windows, Linux, and macOS.

            The macOS application is a Universal 2 build supporting both Apple silicon (arm64) and Intel (x86_64).
          files: |
            release-assets/Space-Werewolf-windows.zip
            release-assets/Space-Werewolf-linux.tar.gz
            release-assets/Space-Werewolf-mac-universal2.zip